# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

tone_instructions: >-
  Be concise and evidence-driven. Report actionable defects with concrete
  failure scenarios. Prioritize correctness, security, compatibility,
  performance, and regressions. Avoid style nitpicks, speculation,
  and unrelated issues.

reviews:
  profile: assertive
  request_changes_workflow: false

  high_level_summary: false
  auto_title_placeholder: ""
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  enable_prompt_for_ai_agents: false

  slop_detection:
    enabled: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    docstrings:
      mode: "off"

  path_filters:
    - "!dist/**"
    - "!package-lock.json"
    - "!screenshots/**"
    - "!assets/*.png"
    - "!repo.json"
    - "!repo-webos22.json"

  path_instructions:
    - path: "src/**"
      instructions: >-
        This code is injected into YouTube's TV web app (youtube.com/tv)
        on LG webOS TVs, from webOS 3 (Chrome 38, through the Babel-built
        legacy package) to webOS 25.

        COMPATIBILITY:
        Flag browser APIs unavailable in Chrome 38 or other supported
        webOS versions unless correctly polyfilled in src/polyfills.js.
        Check syntax compatibility, not only API compatibility.
        Do not suggest modern APIs without checking the actual runtime.

        YOUTUBE INTEGRATION:
        YouTube's markup, data structures, internal globals and navigation
        behavior change without notice. Handle missing elements, undefined
        data, unexpected page states and navigation transitions gracefully.
        Avoid brittle selectors and assumptions about internal YouTube APIs.

        LIFECYCLE:
        Check SPA navigation, repeated initialization, event listeners,
        MutationObservers, intervals, timeouts and cleanup.
        Flag duplicate handlers, stale references, memory leaks and
        operations that continue after the relevant page or component
        is no longer active.

        PERFORMANCE:
        Prioritize TV hardware constraints.
        Flag unnecessary DOM queries, repeated full DOM scans, expensive
        work in mutation callbacks, excessive timers, layout thrashing,
        synchronous work and expensive operations on every frame.
        Prefer debouncing, throttling, caching and limiting DOM operations
        where appropriate.

        WEBOS:
        Verify webOS-specific APIs are available and guarded.
        Handle missing APIs, delayed initialization and device differences.
        Do not assume behavior is identical across webOS versions.

        NETWORK AND ERROR HANDLING:
        Handle failed requests, timeouts, missing responses and malformed
        data without breaking YouTube's normal functionality.
        Check that injected code does not interfere with unrelated
        YouTube functionality.

        REGRESSION:
        Preserve existing functionality and compatibility.
        Do not recommend broad refactors unrelated to the change.
        Pay attention to side effects on other parts of the injected app.

    - path: "bench/**"
      instructions: >-
        Behaviour tests run by bench/ci.sh in CI.
        Verify that assertions fail when the tested logic is broken.
        Check boundary conditions, invalid inputs, missing values,
        regressions and asynchronous behavior.
        Ensure timing does not make a test pass by luck.
        Avoid tests that only verify implementation details.

    - path: ".github/workflows/**"
      instructions: >-
        Check workflow permissions and least privilege.
        Ensure third-party actions are pinned to immutable commit SHAs.
        Check fork pull request security and untrusted input handling.
        Verify that release publishing, repo.json modification and
        pushes to main only happen in explicitly intended workflows.
        Flag unsafe secrets exposure and excessive token permissions.

  tools:
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  art: false

knowledge_base:
  learnings:
    scope: local
