# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews every pull request, strictly, and comments: it does not
# write into the PR description or label the PR. It commits to the branch
# only when asked, with "@coderabbitai fix comments" or the Fix comments box.
language: en-US
tone_instructions: >-
  Be direct and specific. Point out real defects and risks with the failing
  case; skip praise and restating the diff.

reviews:
  profile: assertive
  request_changes_workflow: false

  # Comments only: nothing in the PR description, no labels, no reviewers.
  high_level_summary: false
  auto_title_placeholder: ""
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  # Fix comments works from these blocks.
  enable_prompt_for_ai_agents: true
  slop_detection:
    enabled: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  # Only Fix comments pushes to the PR branch, and only when asked.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: true
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    docstrings:
      mode: "off"

  path_filters:
    - "!dist/**"
    - "!package-lock.json"
    - "!screenshots/**"
    - "!assets/*.png"
    - "!repo.json"
    - "!repo-webos22.json"

  path_instructions:
    - path: "src/**"
      instructions: >-
        This code is injected into YouTube's TV web app (youtube.com/tv) on LG
        webOS TVs, from webOS 3 (Chrome 38, through the Babel-built legacy
        package) to webOS 25. Flag browser APIs that Chrome 38 lacks unless
        they are polyfilled in src/polyfills.js or transpiled. YouTube's own
        markup, data shapes and globals change without notice: flag code that
        breaks the page or throws when they are missing instead of degrading.
        Flag work done on every frame or every DOM mutation that a TV CPU
        would feel, and timers or listeners that are never removed.
    - path: "bench/**"
      instructions: >-
        Behaviour tests run by bench/ci.sh in CI. Check that each assertion
        would fail if the logic it covers broke, and that timing does not make
        a test pass by luck.
    - path: ".github/workflows/**"
      instructions: >-
        Check permissions, that actions stay pinned to commits, and that
        nothing can publish a release, change repo.json or push to main
        outside the event meant for it.

  tools:
    # The repo's ESLint baseline is not clean yet: it would bury the review.
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  art: false

knowledge_base:
  learnings:
    scope: local
