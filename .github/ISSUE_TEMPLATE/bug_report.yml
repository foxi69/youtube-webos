name: 🐛 Bug report
description: Something does not work, or works wrong, on your TV.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! 🦊 A report with the app version, the TV and the steps gets fixed much faster.
        Please check the [open issues](https://github.com/foxi69/youtube-webos/issues) first, in case it is already reported.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Homebrew Channel's app list, or in the name of the `.ipk` you installed.
      placeholder: "0.8.8"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - webOS 22+ (`_webOS22+.ipk`)
        - Legacy (`.ipk`, webOS 3-6)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Homebrew Channel
        - Device Manager
        - webOS CLI (ares-install)
        - Other
    validations:
      required: true

  - type: input
    id: webos
    attributes:
      label: webOS version
      description: TV Settings → General → About This TV, or `core_os_release` in `/var/run/nyx/os_info.json`.
      placeholder: "webOS 24 (9.2.0)"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: TV model
      description: Optional, but it helps. `product_id` in `/var/run/nyx/device_info.json`.
      placeholder: "OLED55C4"

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What goes wrong, and what you expected instead. Screenshots or a phone video are very welcome.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest way to make it happen. A link to a video that shows it helps a lot.
      placeholder: |
        1. Open a video
        2. Press ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: The options you switched away from their defaults, if any (Ad Blocking, SponsorBlock, codec, ...).

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The official YouTube app is uninstalled.
          required: true
        - label: The settings panel opens with the 🟩 Green button.
        - label: It still happens after closing the app fully and starting it again.
