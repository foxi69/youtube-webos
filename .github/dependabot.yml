# Dependabot version updates for the GitHub Actions in .github/workflows only:
# one grouped pull request a month. They touch CI, never the TV packages.
#
# The npm dependencies are left out on purpose. They are almost all build
# tools (webpack, Babel, postcss), and an update there can break the legacy
# webOS 3-6 bundle in ways CI does not catch, since CI only checks that it
# builds. Security alerts and security updates for them are separate, in the
# repository settings (Code security), and do not need this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: CI
