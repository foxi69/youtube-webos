# Dependabot version updates, once a month.
#
# GitHub Actions: one grouped pull request. It touches CI, never the TV
# packages.
#
# npm: one grouped pull request with the minor and patch updates of the
# packages on the allow list only. Those are the lint, type-check and test
# tools, which cannot change what is shipped (CI fails if one of them
# breaks), and LG's CLI, which packs the .ipk and is checked by installing
# the package on a TV.
#
# Everything that produces the bundle (webpack, Babel, postcss, cssnano,
# terser and the runtime dependencies) is left out on purpose: an update
# there can change the legacy webOS 3-6 bundle in ways CI does not catch, and
# there is no such TV to test on. A new package is not watched until it is
# added to the list. Major versions are left out too; they are migrations and
# are done by hand.
#
# Security alerts and security updates are separate, in the repository
# settings (Code security), and do not need this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: CI
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: '@webos-tools/cli'
      - dependency-name: '@eslint/js'
      - dependency-name: '@stylistic/eslint-plugin'
      - dependency-name: '@types/*'
      - dependency-name: c8
      - dependency-name: eslint
      - dependency-name: eslint-config-prettier
      - dependency-name: eslint-plugin-regexp
      - dependency-name: globals
      - dependency-name: husky
      - dependency-name: jsdom
      - dependency-name: lint-staged
      - dependency-name: monocart-coverage-reports
      - dependency-name: playwright
      - dependency-name: prettier
      - dependency-name: typescript
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: Dependencies
