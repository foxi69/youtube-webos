# Dependabot version updates, once a month.
#
# GitHub Actions: one grouped pull request. It touches CI, never the TV
# packages.
#
# npm: one grouped pull request with the minor and patch updates. Almost all
# of these are build tools (webpack, Babel, postcss), and an update there can
# change the legacy webOS 3-6 bundle in ways CI does not catch, so that pull
# request gets a TV test before it is merged. Major versions are left out:
# they are migrations (Babel 8, ESLint 10, TypeScript 7) and are done by hand.
#
# Security alerts and security updates are separate, in the repository
# settings (Code security), and do not need this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: CI
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: Dependencies
