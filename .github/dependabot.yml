# Dependabot version updates, once a month.
#
# GitHub Actions: one grouped pull request. It touches CI, never the TV
# packages.
#
# npm: only LG's CLI (@webos-tools/cli), which packs the .ipk. It pins its
# own dependencies with an npm-shrinkwrap.json, so a vulnerability in one of
# them can only be fixed by a new CLI release. Its update is checked by
# installing the package on a TV before the merge.
#
# The other npm dependencies are left out on purpose. They are almost all
# build tools (webpack, Babel, postcss), and an update there can break the
# legacy webOS 3-6 bundle in ways CI does not catch. Security alerts and
# security updates for them are separate, in the repository settings (Code
# security), and do not need this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: CI
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: '@webos-tools/cli'
    commit-message:
      prefix: CI
