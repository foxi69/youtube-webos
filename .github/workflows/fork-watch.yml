name: Fork watch

# Once a day, looks for new work in the youtube-webos fork network - new
# commits on any fork of NicholasBly/youtube-webos, webosbrew/youtube-webos or
# the original FriedChickenButt/youtube-webos, pull requests opened or
# updated on those three repositories, and issues newly opened on them that
# are still open - and opens an
# issue (label "fork-watch") listing it. Suggestions only: nothing is merged.
# See tools/fork-watch.py.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Report new work in the fork network
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOT_REPOS: NicholasBly/youtube-webos,webosbrew/youtube-webos,FriedChickenButt/youtube-webos
        run: python3 tools/fork-watch.py
