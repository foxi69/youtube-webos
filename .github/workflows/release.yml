name: Draft release

# Every push to main builds both packages - the webOS 22+ one and the legacy
# one for webOS 3-6 - and puts them in a DRAFT release. Drafts are visible
# only to people with write access, so nothing is published yet:
#
#   1. Download the .ipk for your TV from the draft on the Releases page and
#      test it.
#   2. If it is good, open the draft and press "Publish release".
#
# Publishing creates the tag and runs "Update Homebrew Repository"
# (build_repo.yml), which points repo.json at the new release.
#
# The version of the draft:
#   - the one in package.json, while it is not published yet (a bump by
#     hand, for example to 0.9.0, wins);
#   - otherwise the version of the open draft, so later pushes refresh it;
#   - otherwise the latest published release plus one patch (0.8.8 -> 0.8.9),
#     which starts a new draft.
# The build writes that version into package.json and appinfo.json on the
# runner only; nothing is committed.
#
# Drafts of other versions are deleted when a draft is made, so only the
# current test build is on the Releases page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_published() { [ "$(gh release view "v$1" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; }
          version="$(node -p "require('./package.json').version")"
          if is_published "$version"; then
            draft="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft)][0].tag_name // empty')"
            if [ -n "$draft" ]; then
              version="${draft#v}"
            else
              latest="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="$major.$minor.$((patch + 1))"
            fi
          fi
          if gh release view "v$version" > /dev/null 2>&1; then exists=true; else exists=false; fi
          echo "Draft version: $version (draft exists: $exists)" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Build both packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm pkg set version="$VERSION"
          node tools/sync-version.cjs
          # Start clean before each build so no earlier package ends up
          # inside a new one.
          rm -rf dist out legacy
          npm run build:modern
          npx ares-package -n dist -o out
          mv "out/youtube.leanback.v4_${VERSION}_all.ipk" "out/youtube.leanback.v4_${VERSION}_all_webOS22+.ipk"

          rm -rf dist
          npm run build
          npx ares-package -n dist -o legacy
          mv "legacy/youtube.leanback.v4_${VERSION}_all.ipk" out/

          ls -l out
          sha256sum out/*.ipk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The notes are what the published release shows, so they are
          # written for the people installing it: the template in
          # .github/release-notes.md with this version's CHANGELOG.md section.
          bash tools/release-notes.sh "$VERSION" "${GITHUB_SHA::7}" > notes.md
          {
            echo "**Draft for testing** - built from ${GITHUB_SHA::7}. If it works on the TV, press *Publish release*."
            echo
            echo "<details><summary>Release notes</summary>"
            echo
            cat notes.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ steps.version.outputs.exists }}" = "true" ]; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "YouTube AdFree $VERSION" --notes-file notes.md
            gh release upload "$TAG" out/*.ipk --clobber
          else
            gh release create "$TAG" out/*.ipk --draft --target "$GITHUB_SHA" --title "YouTube AdFree $VERSION" --notes-file notes.md
          fi
          echo "Draft release $TAG is ready: ${{ github.server_url }}/${{ github.repository }}/releases" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove drafts of other versions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Only one test build is current. Drafts were never published, so
          # nothing that anyone installed from goes away with them.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name != \"$TAG\") | \"\(.id) \(.tag_name)\"" |
          while read -r id tag; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            echo "Removed the stale draft $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          done
