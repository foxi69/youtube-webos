name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # dist/ also holds the committed .ipk files: clear them first, or they
      # would be packed into the new .ipk. `npm run package` writes into
      # dist/, so the package goes to out/ instead, where the upload finds it.
      - name: Build and package
        run: |
          rm -rf dist out
          npm run build
          npx ares-package -n dist -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: youtube_adfree_ipk
          path: out/youtube.leanback.v4_*_all.ipk
          if-no-files-found: error
