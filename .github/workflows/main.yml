name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checkout and the artifact upload are all this needs; the artifact upload
# uses the Actions runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Builds both packages and runs every bench test (bench/ci.sh).
      - name: Test
        run: npm test

      # The same tests under c8: the report goes to the job summary, and the
      # HTML version is uploaded below.
      - name: Coverage
        run: |
          npm run coverage
          node bench/coverage-summary.cjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      # The tests leave other builds in dist/: start clean. The package goes
      # to out/, where the upload finds it.
      - name: Build and package
        run: |
          rm -rf dist out
          npm run build
          npx ares-package -n dist -o out

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: youtube_adfree_ipk
          path: out/youtube.leanback.v4_*_all.ipk
          if-no-files-found: error
