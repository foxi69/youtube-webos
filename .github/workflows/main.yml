name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checkout and the artifact upload are all this needs; the artifact upload
# uses the Actions runtime token, not GITHUB_TOKEN. The build job adds
# actions: write for its artifact cleanup.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # actions: write for the artifact cleanup below.
    permissions:
      contents: read
      actions: write

    steps:
      # The artifact storage is finite: adding up the sizes of the artifacts
      # that have not expired, newest first, it deletes the ones above the
      # budget (the oldest). GitHub recounts the storage used every 6-12
      # hours, so the budget leaves room under the quota for a few runs' new
      # artifacts. A pull request from a fork gets a read-only token, so it is
      # skipped there. The same step as in foxi69/MultiUploader's build.
      - name: Delete the oldest artifacts above the budget
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_BUDGET_MB: 400
        run: |
          budget=$((ARTIFACT_BUDGET_MB * 1024 * 1024))
          total=0
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | [.created_at, .id, .size_in_bytes, .name] | @tsv' \
            | sort -r \
            | while IFS=$'\t' read -r created id size name; do
                total=$((total + size))
                if [ "$total" -gt "$budget" ]; then
                  echo "Deleting $name ($id, $created, $size bytes)"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || echo "Could not delete $id (already gone?)"
                fi
              done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Builds both packages and runs every bench test (bench/ci.sh).
      - name: Test
        run: npm test

      # The same tests under c8: the report goes to the job summary, and the
      # HTML version is uploaded below.
      - name: Coverage
        run: |
          npm run coverage
          node bench/coverage-summary.cjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 7

      # The tests leave other builds in dist/: start clean. The package goes
      # to out/, where the upload finds it.
      - name: Build and package
        run: |
          rm -rf dist out
          npm run build
          npx ares-package -n dist -o out

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: youtube_adfree_ipk
          path: out/youtube.leanback.v4_*_all.ipk
          if-no-files-found: error
          retention-days: 7
