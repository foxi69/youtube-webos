name: Scorecard

# OpenSSF Scorecard: scores how hard it would be to tamper with this
# repository or its releases unnoticed (pinned actions, token permissions,
# branch protection, code review, signed releases, dangerous workflow
# patterns, ...). It matters here because the TVs update from the GitHub
# releases through repo.json. Each check that falls short shows up as an
# alert under Security > Code scanning, and the score is published to
# scorecard.dev. It reads the repository and writes nothing to it.
# See https://github.com/ossf/scorecard-action

on:
  # The Branch-Protection check reads the branch rules, so changing them
  # reruns it.
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; the job asks for only what it needs.
permissions: {}
# Blocks all cache access (added to GitHub Actions in September 2026, so
# some workflow linters may not know it yet).
cache-mode: none

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Sign the results published to api.scorecard.dev, proving they come
      # from this repository's workflow. Grants no access to the repository.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF file as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
