name: Sync upstream

# Keeps this fork up to date with its upstream, NicholasBly/youtube-webos.
#
# Once a day (or on demand from the Actions tab) the upstream main branch is
# merged into the `upstream-sync` branch, starting from this fork's main, and a
# pull request is opened for it. Nothing is ever pushed to main directly, so
# the fork's own changes are never overwritten: you review and merge the PR.
#
# If the merge conflicts (both sides changed the same lines), the job fails
# with a list of the conflicting files and nothing is pushed. Resolve it
# locally - see "Staying up to date with upstream" in README.md.
#
# Opening the pull request needs: Settings -> Actions -> General ->
# Workflow permissions -> "Allow GitHub Actions to create and approve pull
# requests". Without it the branch is still pushed and the job summary links
# to a ready-made "compare" page.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/NicholasBly/youtube-webos.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch "$UPSTREAM_REPO" "$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### New upstream commits"
              echo '```'
              git log --oneline --no-merges "HEAD..upstream/$UPSTREAM_BRANCH"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into the sync branch
        if: steps.check.outputs.behind == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An open sync PR may carry your own conflict fixes: build on it
          # instead of starting over, so nothing on it is ever force-pushed away.
          open_pr="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[].number')"
          if [ -n "$open_pr" ]; then
            git fetch origin "$SYNC_BRANCH"
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git checkout -B "$SYNC_BRANCH"
          fi
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"

          if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            {
              echo "### Merge conflict - resolve it by hand"
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

          if [ -n "$open_pr" ]; then
            git push origin "$SYNC_BRANCH"
          else
            git push --force origin "$SYNC_BRANCH"
          fi

      - name: Open the pull request
        if: steps.check.outputs.behind == 'true' && steps.merge.outputs.open_pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr create --base main --head "$SYNC_BRANCH" \
              --title "Sync with upstream NicholasBly/youtube-webos" \
              --body "Automatic merge of NicholasBly/youtube-webos main into this fork. Review the upstream changes, test, then merge."; then
            echo "Could not open the pull request (see the permissions note at the top of this workflow). Open it here: ${{ github.server_url }}/${{ github.repository }}/compare/main...$SYNC_BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
